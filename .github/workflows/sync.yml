name: Synchro Shopify

on:
  schedule:
    - cron: "17 3 * * *"   # chaque nuit vers 4 h-5 h (heure de Paris)
  workflow_dispatch: {}     # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths: ["sync/**"]

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt pytest
      - run: python -m pytest -q sync/tests

  sync:
    needs: tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt
      - name: Shopify -> Supabase
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m sync.main
